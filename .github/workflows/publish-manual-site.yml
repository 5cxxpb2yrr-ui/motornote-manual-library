name: Publish private manual website

on:
  push:
    branches: [main]
    paths:
      - "manuals/**"
      - "index/**"
      - "scripts/publish_manual_site.py"
      - "site-worker/assets/**"
      - ".github/workflows/publish-manual-site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manual-site-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out manual corpus with Git LFS
        uses: actions/checkout@v4
        with:
          ref: main
          lfs: true
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install AWS CLI
        run: python -m pip install --disable-pip-version-check awscli
      - name: Publish private manual website directly to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: "3481a3f4006a12f337ceb86104d0816b"
          R2_BUCKET: motornote-manual-site
        run: python scripts/publish_manual_site.py
