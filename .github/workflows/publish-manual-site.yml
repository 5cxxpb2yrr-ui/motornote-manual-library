name: Publish MotorNote manual site (controlled)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Dry-run validates only; delta publishes changes since a supplied base SHA; publish rebuilds the full site."
        required: true
        type: choice
        options:
          - dry-run
          - delta
          - publish
        default: dry-run
      base_sha:
        description: "Required for delta mode: the last published commit SHA to compare against the selected ref."
        required: false
        type: string
        default: ""
      confirmation:
        description: "Required for delta/publish: PUBLISH_MOTORNOTE_MANUAL_SITE"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: motornote-manual-site-production
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Verify production authorization
        if: ${{ inputs.mode != 'dry-run' }}
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          MODE: ${{ inputs.mode }}
          BASE_SHA: ${{ inputs.base_sha }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Production publishing is allowed only from main."
            exit 1
          fi
          if [ "$CONFIRMATION" != "PUBLISH_MOTORNOTE_MANUAL_SITE" ]; then
            echo "::error::Exact production confirmation is required."
            exit 1
          fi
          if [ "$MODE" = "delta" ] && [ -z "$BASE_SHA" ]; then
            echo "::error::Delta mode requires the last published commit SHA in base_sha."
            exit 1
          fi

      - name: Check out manual corpus for delta mode
        if: ${{ inputs.mode == 'delta' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          lfs: false
          fetch-depth: 0

      - name: Check out manual corpus for dry-run or full publish
        if: ${{ inputs.mode != 'delta' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          lfs: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run publisher safety tests
        run: python -m unittest discover -s tests -v

      - name: Validate and preview the complete site
        if: ${{ inputs.mode == 'dry-run' || inputs.mode == 'delta' }}
        run: python scripts/manual_site_publisher.py --mode dry-run

      - name: Publish only changed objects to Cloudflare R2
        if: ${{ inputs.mode == 'delta' }}
        env:
          MOTORNOTE_EVENT_BEFORE: ${{ inputs.base_sha }}
          MOTORNOTE_SHA: ${{ github.sha }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: "3481a3f4006a12f337ceb86104d0816b"
          R2_BUCKET: motornote-manual-site
        run: |
          python -m pip install --disable-pip-version-check awscli
          python scripts/manual_site_publisher.py --mode delta

      - name: Publish complete validated site to Cloudflare R2
        if: ${{ inputs.mode == 'publish' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: "3481a3f4006a12f337ceb86104d0816b"
          R2_BUCKET: motornote-manual-site
        run: |
          python -m pip install --disable-pip-version-check awscli
          python scripts/manual_site_publisher.py --mode publish

      - name: Upload HTML cross-reference validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: html-cross-reference-validation
          path: html-cross-reference-report.json
          if-no-files-found: ignore
          retention-days: 30
