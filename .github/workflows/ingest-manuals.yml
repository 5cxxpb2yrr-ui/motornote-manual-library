name: Ingest service manuals

on:
  push:
    branches: [main]
    paths:
      - "incoming/**/*.zip"
      - "incoming/*.zip"
      - "scripts/ingest_manuals.py"
      - ".github/workflows/ingest-manuals.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: manual-ingestion-main
  cancel-in-progress: false

jobs:
  ingest:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository with Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Install Git LFS
        run: |
          git lfs install
          git lfs track "*.pdf" "*.PDF" "*.jpg" "*.jpeg" "*.png" "*.tif" "*.tiff"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install PDF text extraction
        run: python -m pip install --upgrade pymupdf

      - name: Extract and index uploaded ZIP files
        run: python scripts/ingest_manuals.py

      - name: Commit extracted manuals and search index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .gitattributes manuals index incoming
          if git diff --cached --quiet; then
            echo "No ingestion changes to commit."
            exit 0
          fi
          git commit -m "Ingest service manual archive"
          git push
