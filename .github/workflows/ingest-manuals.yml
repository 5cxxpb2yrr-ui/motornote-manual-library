name: Ingest service manuals

on:
  push:
    branches: [main]
    paths:
      - "incoming/**/*.zip"
      - "incoming/*.zip"
  release:
    types: [published]
  pull_request:
    paths:
      - "scripts/ingest_manuals.py"
      - "tests/**"
      - "scripts/validate_html_cross_references.py"
      - "scripts/publish_manual_site.py"
      - "scripts/manual_site_publisher.py"
      - ".github/workflows/ingest-manuals.yml"
  workflow_dispatch:
    inputs:
      sync_to_retrieval:
        description: "Upload manuals to MotorNote after the cleanup/index step"
        required: false
        type: boolean
        default: false
      full_backfill:
        description: "Index every eligible HTML/text manual file in the repository (overrides the test upload limit)"
        required: false
        type: boolean
        default: false
      upload_limit:
        description: "Maximum documents for a manual test upload (ignored when targeted paths are supplied)"
        required: true
        type: string
        default: "20"
      targeted_paths:
        description: "Optional newline-separated paths relative to manuals/; uploads only these files"
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: manual-ingestion-main
  cancel-in-progress: false

jobs:
  test-cleaner:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test manual HTML cleanup
        run: python -m unittest discover -s tests -v

  ingest:
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository with Git LFS
        uses: actions/checkout@v4
        with:
          ref: main
          lfs: true
          fetch-depth: 0

      - name: Download ZIP assets from published release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p incoming
          tag="${{ github.event.release.tag_name }}"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir incoming --pattern "*.zip" --pattern "*.ZIP" --clobber
          find incoming -type f \( -iname '*.zip' \) -print -quit | grep -q . || {
            echo "No ZIP assets found in release $tag."
            exit 1
          }

      - name: Install Git LFS
        run: |
          git lfs install
          git lfs track "*.pdf" "*.PDF" "*.jpg" "*.jpeg" "*.png" "*.tif" "*.tiff"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDF text extraction
        run: python -m pip install --upgrade pymupdf

      - name: Test manual HTML cleanup
        run: python -m unittest discover -s tests -v

      - name: Extract, clean, and index manuals
        if: github.event_name != 'workflow_dispatch' || inputs.full_backfill != true
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            python scripts/ingest_manuals.py --clean-existing
          else
            python scripts/ingest_manuals.py
          fi

      - name: Commit extracted manuals and search index
        if: github.event_name != 'workflow_dispatch' || inputs.full_backfill != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .gitattributes manuals index incoming
          if git diff --cached --quiet; then
            echo "No ingestion changes to commit."
          else
            git commit -m "Ingest service manual archive"
            git push origin HEAD:main
          fi

      - name: Install AWS CLI
        run: python -m pip install --disable-pip-version-check awscli

      - name: Publish private manual website directly to R2
        if: github.event_name != 'workflow_dispatch' || inputs.full_backfill != true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: "3481a3f4006a12f337ceb86104d0816b"
          R2_BUCKET: motornote-manual-site
        run: python scripts/manual_site_publisher.py --mode publish


      - name: Upload HTML cross-reference validation report
        if: always() && hashFiles('html-cross-reference-report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: html-cross-reference-validation
          path: html-cross-reference-report.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Preview MotorNote retrieval sync
        if: github.event_name == 'workflow_dispatch' && inputs.sync_to_retrieval != true && inputs.full_backfill != true
        run: python scripts/sync_manuals_to_retrieval.py --dry-run

      - name: Sync manual content to MotorNote retrieval
        if: github.event_name != 'workflow_dispatch' || inputs.sync_to_retrieval == true || inputs.full_backfill == true
        env:
          MOTORNOTE_API_URL: https://motornote-manual-retrieval.phillipstg.workers.dev
          MOTORNOTE_API_TOKEN: ${{ secrets.MOTORNOTE_API_TOKEN }}
          TARGETED_PATHS: ${{ inputs.targeted_paths }}
          UPLOAD_LIMIT: ${{ inputs.upload_limit }}
          FULL_BACKFILL: ${{ inputs.full_backfill }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$FULL_BACKFILL" = "true" ]; then
              echo "Full backfill selected: uploading every eligible HTML/text manual file."
              python scripts/sync_manuals_to_retrieval.py
            elif [ -n "$TARGETED_PATHS" ]; then
              printf '%s\n' "$TARGETED_PATHS" > /tmp/motornote-targeted-paths.txt
              python scripts/sync_manuals_to_retrieval.py --paths-from-file /tmp/motornote-targeted-paths.txt
            else
              python scripts/sync_manuals_to_retrieval.py --limit "$UPLOAD_LIMIT"
            fi
          else
            python scripts/sync_manuals_to_retrieval.py
          fi

      - name: Remove successfully ingested ZIP assets from release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.event.release.tag_name }}"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' |
            while IFS= read -r asset; do
              case "$asset" in
                *.zip|*.ZIP)
                  gh release delete-asset "$tag" "$asset" --repo "$GITHUB_REPOSITORY" --yes
                  ;;
              esac
            done
