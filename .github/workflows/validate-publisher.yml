name: Validate MotorNote publishing system

on:
  pull_request:
    paths:
      - "scripts/manual_site_publisher.py"
      - "scripts/publish_manual_site.py"
      - "scripts/publish_manual_delta.py"
      - "scripts/validate_html_cross_references.py"
      - "scripts/build_navigation_from_breadcrumbs.py"
      - "tests/**"
      - "site-worker/**"
      - "worker/**"
      - ".github/workflows/validate-publisher.yml"
      - ".github/workflows/publish-manual-site.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run all Python tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python navigation generator, publisher, and validators
        run: |
          python -m py_compile scripts/build_navigation_from_breadcrumbs.py scripts/manual_site_publisher.py scripts/publish_manual_site.py scripts/publish_manual_delta.py scripts/validate_html_cross_references.py
      - name: Generate navigation indexes from the full source corpus
        run: python scripts/build_navigation_from_breadcrumbs.py
      - name: Assert Scion page 2601 matches its source breadcrumb
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def find_page(node, page_id, path=()):
              for child in node.get("c", []):
                  current = (*path, child.get("n", ""))
                  if child.get("p") == page_id:
                      return current
                  if "c" in child:
                      found = find_page(child, page_id, current)
                      if found:
                          return found
              return None

          tree = json.loads(Path("index/navigation/scion-repair.json").read_text())
          expected = (
              "Electrical",
              "Wiring Diagrams",
              "OEM Connector End Views",
              "Connector List",
              "Noise Filter (Ignition) Connector End View (N 1)",
          )
          actual = find_page(tree, 2601)
          if actual != expected:
              raise SystemExit(f"page 2601 mismatch: expected={expected!r}; actual={actual!r}")
          print("Scion page 2601 navigation matches its source HTML breadcrumb.")
          PY
      - name: Validate the complete staged R2 site without publishing
        run: python scripts/manual_site_publisher.py --mode dry-run
      - name: Validate Worker and Phoenix JavaScript syntax
        run: |
          node --input-type=module --check < worker/src/index.js
          node --input-type=module --check < site-worker/src/index.js
          node --check site-worker/assets/phoenix.js
      - name: Validate Wrangler JSON configurations
        run: |
          node -e 'JSON.parse(require("node:fs").readFileSync("worker/wrangler.jsonc", "utf8"))'
          node -e 'JSON.parse(require("node:fs").readFileSync("site-worker/wrangler.jsonc", "utf8"))'
