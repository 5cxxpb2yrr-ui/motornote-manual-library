name: Manual Explorer Pages Preview

on:
  push:
    branches:
      - fix/manual-explorer-r2-catalog-20261113
    paths:
      - "experimental/manual-explorer-pro/**"
      - ".github/workflows/manual-explorer-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manual-explorer-pages-preview
  cancel-in-progress: true

jobs:
  deploy-preview:
    name: Validate and deploy preview
    if: github.ref == 'refs/heads/fix/manual-explorer-r2-catalog-20261113'
    runs-on: ubuntu-latest
    steps:
      - name: Check out only the Manual Explorer app
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1
          sparse-checkout: experimental/manual-explorer-pro

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate application JavaScript
        working-directory: experimental/manual-explorer-pro
        run: node --check app.js

      - name: Validate deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Add the CLOUDFLARE_API_TOKEN repository secret."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Add the CLOUDFLARE_ACCOUNT_ID repository secret."; exit 1; }

      - name: Deploy to the existing Cloudflare Pages preview project
        working-directory: experimental/manual-explorer-pro
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy . \
            --project-name lifeos-manual-explorer-pro \
            --branch "$GITHUB_REF_NAME" \
            --commit-hash "$GITHUB_SHA"
