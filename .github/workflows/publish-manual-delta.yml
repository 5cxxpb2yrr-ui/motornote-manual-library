name: Publish MotorNote manual changes (incremental)

on:
  push:
    branches: [main]
    paths:
      - "manuals/**"
      - "index/**"
      - "site-worker/assets/phoenix.css"
      - "site-worker/assets/phoenix.js"

permissions:
  contents: read

concurrency:
  group: motornote-manual-site-delta
  cancel-in-progress: false

jobs:
  publish-delta:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out complete Git history
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run publisher safety tests
        run: python -m unittest discover -s tests -v

      - name: Validate the complete staged site before publishing
        run: python scripts/manual_site_publisher.py --mode dry-run

      - name: Install AWS CLI
        run: python -m pip install --disable-pip-version-check awscli

      - name: Publish only changed objects to Cloudflare R2
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: "3481a3f4006a12f337ceb86104d0816b"
          R2_BUCKET: motornote-manual-site
        run: python scripts/manual_site_publisher.py --mode delta

      - name: Upload HTML cross-reference validation report
        if: always() && hashFiles('html-cross-reference-report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: html-cross-reference-validation
          path: html-cross-reference-report.json
          if-no-files-found: ignore
          retention-days: 30
