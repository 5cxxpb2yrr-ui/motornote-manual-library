name: Rebuild MotorNote corpus (PR dry-run only)

on:
  workflow_dispatch:
    inputs:
      source_release:
        description: "GitHub Release tag containing scion-service-manual.zip and subaru-service-manual.zip"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: motornote-corpus-pr-dry-run
  cancel-in-progress: false

jobs:
  rebuild-and-validate:
    if: github.ref == 'refs/heads/rebuild/publishing-system-20261121'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out the selected PR branch and existing corpus
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          lfs: true
          fetch-depth: 1

      - name: Download the two source archives from the selected release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RELEASE: ${{ inputs.source_release }}
        run: |
          mkdir -p incoming
          gh release download "$SOURCE_RELEASE" --repo "$GITHUB_REPOSITORY" --dir incoming --pattern "scion-service-manual.zip" --clobber
          gh release download "$SOURCE_RELEASE" --repo "$GITHUB_REPOSITORY" --dir incoming --pattern "subaru-service-manual.zip" --clobber
          test -s incoming/scion-service-manual.zip
          test -s incoming/subaru-service-manual.zip
          ls -lh incoming/*.zip

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDF text extraction dependency
        run: python -m pip install --disable-pip-version-check pymupdf

      - name: Run ingestion and cleanup tests
        run: python -m unittest discover -s tests -v

      - name: Rebuild both manuals and regenerate the catalog
        run: python scripts/ingest_manuals.py

      - name: Assert the rebuilt catalog matches the expected corpus
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path("index/summary.json").read_text())
          expected = {
              "manual_count": 2,
              "file_count": 66423,
              "manuals": {
                  "scion-service-manual": 19875,
                  "subaru-service-manual": 46548,
              },
          }
          actual = {
              "manual_count": summary["manual_count"],
              "file_count": summary["file_count"],
              "manuals": {item["id"]: item["file_count"] for item in summary["manuals"]},
          }
          print(json.dumps(actual, indent=2))
          if actual != expected:
              raise SystemExit(f"Catalog does not match expected rebuilt corpus: {actual!r}")
          PY

      - name: Validate complete staged site without publishing
        run: python scripts/manual_site_publisher.py --mode dry-run

      - name: Upload HTML cross-reference validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rebuilt-corpus-html-validation
          path: html-cross-reference-report.json
          if-no-files-found: ignore
          retention-days: 30
