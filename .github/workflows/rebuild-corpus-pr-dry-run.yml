name: Rebuild MotorNote corpus (PR dry-run only)

on:
  push:
    branches:
      - rebuild/publishing-system-20261121
  workflow_dispatch:
    inputs:
      source_release_id:
        description: "Numeric ID of the draft release containing the two verified source ZIPs"
        required: false
        default: "454060439"
        type: string

permissions:
  contents: read

concurrency:
  group: motornote-corpus-pr-dry-run
  cancel-in-progress: false

jobs:
  rebuild-and-validate:
    if: github.ref == 'refs/heads/rebuild/publishing-system-20261121'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out the selected PR branch and existing corpus
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          lfs: true
          fetch-depth: 1

      - name: Verify the draft release and download its exact source archives
        env:
          GH_TOKEN: ${{ secrets.MANUAL_SOURCE_TOKEN }}
          SOURCE_RELEASE_ID: ${{ inputs.source_release_id || '454060439' }}
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_RELEASE_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Release ID must contain digits only."
            exit 1
          fi
          echo "Checking repository access with MANUAL_SOURCE_TOKEN..."
          if ! gh api "repos/$GITHUB_REPOSITORY" --jq '.full_name'; then
            echo "::error::MANUAL_SOURCE_TOKEN cannot read this repository. Confirm it is restricted to this repository and has Contents: Read-only or Read and write."
            exit 1
          fi
          echo "Checking access to draft release $SOURCE_RELEASE_ID..."
          if ! gh api "repos/$GITHUB_REPOSITORY/releases/$SOURCE_RELEASE_ID" > /tmp/source-release.json; then
            echo "::error::Token can read the repository but cannot read the draft release. Check repository selection and Contents permission."
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          release = json.loads(Path("/tmp/source-release.json").read_text())
          if release.get("draft") is not True:
              raise SystemExit("Refusing to use a published release; source release must remain a draft.")
          if release.get("tag_name") != "rebuild-corpus-source-20261121":
              raise SystemExit(f"Unexpected source release tag: {release.get('tag_name')!r}")
          expected = {
              "scion-service-manual.zip": (126059381, "3875bc9151c041d92559e7649870ac77d34d5c5378fd94c4b1e1dc0c477092b6"),
              "subaru-service-manual.zip": (277626510, "78f1fc6d415b61bd3d3ff0ba2cd02acad309237c7305aeabb89be01914ed6a91"),
          }
          assets = {asset["name"]: asset for asset in release.get("assets", [])}
          if set(assets) != set(expected):
              raise SystemExit(f"Release assets do not match the two expected archives: {sorted(assets)}")
          for name, (size, digest) in expected.items():
              asset = assets[name]
              if asset.get("state") != "uploaded" or asset.get("size") != size:
                  raise SystemExit(f"Unexpected upload state or size for {name}: {asset}")
              if asset.get("digest") != f"sha256:{digest}":
                  raise SystemExit(f"SHA-256 mismatch in release metadata for {name}")
              print(f"Release metadata verified: {name} ({size} bytes, SHA-256 {digest})")
          PY
          mkdir -p incoming
          echo "Downloading the two verified draft-release assets..."
          gh release download "rebuild-corpus-source-20261121" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "scion-service-manual.zip" \
            --pattern "subaru-service-manual.zip" \
            --dir incoming
          scion_size="$(wc -c < incoming/scion-service-manual.zip | tr -d ' ')"
          scion_sha="$(sha256sum incoming/scion-service-manual.zip | cut -d ' ' -f 1)"
          test "$scion_size" = "126059381"
          test "$scion_sha" = "3875bc9151c041d92559e7649870ac77d34d5c5378fd94c4b1e1dc0c477092b6"
          echo "Verified scion-service-manual.zip ($scion_size bytes, SHA-256 $scion_sha)"
          subaru_size="$(wc -c < incoming/subaru-service-manual.zip | tr -d ' ')"
          subaru_sha="$(sha256sum incoming/subaru-service-manual.zip | cut -d ' ' -f 1)"
          test "$subaru_size" = "277626510"
          test "$subaru_sha" = "78f1fc6d415b61bd3d3ff0ba2cd02acad309237c7305aeabb89be01914ed6a91"
          echo "Verified subaru-service-manual.zip ($subaru_size bytes, SHA-256 $subaru_sha)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDF text extraction dependency
        run: python -m pip install --disable-pip-version-check pymupdf

      - name: Run ingestion and cleanup tests
        run: python -m unittest discover -s tests -v

      - name: Rebuild both manuals and regenerate the catalog
        run: python scripts/ingest_manuals.py

      - name: Assert the rebuilt catalog matches the expected corpus
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path("index/summary.json").read_text())
          expected = {
              "manual_count": 2,
              "file_count": 66423,
              "manuals": {
                  "scion-service-manual": 19875,
                  "subaru-service-manual": 46548,
              },
          }
          actual = {
              "manual_count": summary["manual_count"],
              "file_count": summary["file_count"],
              "manuals": {item["id"]: item["file_count"] for item in summary["manuals"]},
          }
          print(json.dumps(actual, indent=2))
          if actual != expected:
              raise SystemExit(f"Catalog does not match expected rebuilt corpus: {actual!r}")
          PY

      - name: Validate complete staged site without publishing
        run: python scripts/manual_site_publisher.py --mode dry-run

      - name: Upload HTML cross-reference validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rebuilt-corpus-html-validation
          path: html-cross-reference-report.json
          if-no-files-found: ignore
          retention-days: 30
