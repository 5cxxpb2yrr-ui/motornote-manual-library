name: Validate manual retrieval and site workers

on:
  pull_request:
    paths:
      - "worker/**"
      - "site-worker/**"
      - "scripts/publish_manual_site.py"
      - "scripts/validate_manual_links.py"
      - "manuals/**/*.html"
      - "manuals/**/*.htm"
      - "tests/**"
      - ".github/workflows/*.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check retrieval Worker JavaScript syntax
        run: node --input-type=module --check < worker/src/index.js
      - name: Check site Worker JavaScript syntax
        run: node --input-type=module --check < site-worker/src/index.js
      - name: Check Phoenix browser JavaScript syntax
        run: node --check site-worker/assets/phoenix.js
      - name: Test and validate manual HTML cross-references
        run: |
          python -m unittest discover -s tests -v
          python scripts/validate_manual_links.py
      - name: Compile publisher
        run: python -m py_compile scripts/publish_manual_site.py scripts/validate_manual_links.py
      - name: Validate Wrangler configurations
        run: |
          node -e 'JSON.parse(require("node:fs").readFileSync("worker/wrangler.jsonc", "utf8"))'
          node -e 'JSON.parse(require("node:fs").readFileSync("site-worker/wrangler.jsonc", "utf8"))'
