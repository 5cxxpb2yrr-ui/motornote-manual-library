name: Validate manual retrieval worker

on:
  pull_request:
    paths:
      - "worker/**"
      - ".github/workflows/validate-worker.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Worker JavaScript syntax
        run: node --input-type=module --check < worker/src/index.js
      - name: Validate Wrangler configuration
        run: node -e 'JSON.parse(require("node:fs").readFileSync("worker/wrangler.jsonc", "utf8"))'
