name: Validate breadcrumb-generated navigation indexes

on:
  pull_request:
    branches:
      - main
    paths:
      - "manuals/**"
      - "scripts/build_navigation_from_breadcrumbs.py"
      - "scripts/manual_site_publisher.py"
      - "tests/test_build_navigation_from_breadcrumbs.py"
      - ".github/workflows/validate-navigation-index.yml"
      - ".github/workflows/publish-manual-site.yml"

permissions:
  contents: read

concurrency:
  group: motornote-navigation-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out the complete committed manual corpus
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run navigation and publisher unit tests
        run: python -m unittest discover -s tests -v

      - name: Generate navigation indexes from the source HTML corpus
        run: python scripts/build_navigation_from_breadcrumbs.py

      - name: Assert the Scion page 2601 navigation regression is fixed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def find_page(node, page_id, path=()):
              for child in node.get("c", []):
                  current = (*path, child.get("n", ""))
                  if child.get("p") == page_id:
                      return current, child.get("n")
                  if "c" in child:
                      found = find_page(child, page_id, current)
                      if found:
                          return found
              return None

          root = Path("index/navigation")
          expected = {
              "scion-repair.json": "repair",
              "scion-parts.json": "labor",
              "subaru-repair.json": "repair",
              "subaru-labor.json": "labor",
          }
          for filename in expected:
              path = root / filename
              if not path.is_file():
                  raise SystemExit(f"Missing generated navigation tree: {path}")
              tree = json.loads(path.read_text(encoding="utf-8"))
              if not tree.get("c"):
                  raise SystemExit(f"Generated navigation tree is empty: {path}")

          tree = json.loads((root / "scion-repair.json").read_text(encoding="utf-8"))
          result = find_page(tree, 2601)
          expected_path = (
              "Electrical",
              "Wiring Diagrams",
              "OEM Connector End Views",
              "Connector List",
              "Noise Filter (Ignition) Connector End View (N 1)",
          )
          if result != (expected_path, expected_path[-1]):
              raise SystemExit(
                  "Scion page 2601 navigation mismatch: "
                  f"expected={expected_path!r}; actual={result!r}"
              )
          print("Scion page 2601 resolves to the exact source breadcrumb path.")
          PY

      - name: Validate complete staged site without publishing
        run: python scripts/manual_site_publisher.py --mode dry-run

      - name: Upload generated navigation and validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: breadcrumb-navigation-validation
          path: |
            index/navigation/
            html-cross-reference-report.json
          if-no-files-found: error
          retention-days: 30
