  <p>When a wheel speed is being output (the wheel is not locked), if the output values of the speed sensors for 2 wheels are stuck at 0 MPH, the electric brake booster control module judges that a speed sensor is malfunctioning and illuminates the MIL and stores a DTC.</p>
