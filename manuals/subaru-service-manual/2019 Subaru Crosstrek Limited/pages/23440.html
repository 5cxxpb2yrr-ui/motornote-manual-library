  <p>Detect the malfunction of microcomputer (RAM).</p>
  <p>When there is a problem in the CPU normal RAM, judge as NG.</p>
  <p>If it is possible to write data to the whole area of RAM in the initial routine, and is possible to read the same data, it is judged as OK, and if not, NG.</p>
