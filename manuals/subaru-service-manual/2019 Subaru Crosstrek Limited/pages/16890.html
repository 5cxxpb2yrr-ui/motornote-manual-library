<!DOCTYPE html><html><head><meta charset="utf-8"><title>Outline Of Diagnosis — 2019 Subaru Crosstrek Limited Service Manual</title><link rel="stylesheet" href="../style.css"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="Repair manual for the 2019 Subaru Crosstrek Limited, including electrical diagrams, bolt torques, and labor times."></head><body><div class="main"><h1>Outline Of Diagnosis</h1><div id="S35198299422020102700000">
  <p>Detect the rear oxygen sensor heater open or short circuit.</p>
  <p>The rear oxygen sensor heater performs duty control, and the output terminal voltage at ON is 0 V, and the output terminal voltage at OFF is the battery voltage.</p>
  <p>Judge as NG when the terminal voltage remains Low.</p>
