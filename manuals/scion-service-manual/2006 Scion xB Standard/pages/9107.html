<!DOCTYPE html><html><head><meta charset="utf-8"><title>Dye Check — 2006 Scion xB Standard Service Manual ~ LEMON Manuals</title><link rel="stylesheet" href="../style.css"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="Repair manual for the 2006 Scion xB Standard, including electrical diagrams, bolt torques, and labor times."></head><body><div class="main"><h1>Dye Check</h1><div id="S41012426662002031800000">
  <p>Penetrating dye is sprayed on the previously cleaned component. Dye is left on component for 5-45 minutes, depending upon material density. Component is then wiped clean and sprayed with a developing solution. Surface cracks will show up as a bright line.</p>
