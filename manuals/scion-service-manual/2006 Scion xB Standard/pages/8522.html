  <p>If 2 or more ECUs and/or sensors do not appear on the intelligent tester's &quot;BUS CHECK&quot; screen via the CAN VIM, one side of the CAN sub bus line may be open (One side of the CANH [sub bus line] /CANL [sub bus line] of the ECU and/or sensor is open).</p>
